<section class="panel">
    <h1 class="nombre">
        <strong>Ricardo Anibal Castrillon Sanchez</strong>
    </h1>

    <details open id="Desplegable" class="bloque">
        <summary class="card">
            <h2><strong>Estudios</strong></h2>
        </summary>

        <div class="alineacion">
            <article *ngFor="let estudio of estu" class="estudio-card">
                <div [ngStyle]="{'background-image': 'url(/assets/img/' + estudio.Certificado + ')'}" class="imgEstudio">
                    <div class="text-estudio">
                        <p>{{estudio.Institucion}}</p>
                        <p>{{estudio.Fecha}}</p>
                        <p>{{estudio.Tipo}}</p>
                        <p>{{estudio.Habilidad}}</p>
                    </div>
                </div>
            </article>
        </div>
    </details>

    <details open id="Desplegable" class="bloque">
        <summary class="card">
            <h2><strong>Habilidades</strong></h2>
        </summary>

        <div class="alineacion">
            <article *ngFor="let despliegue of herra" class="tool-card">
                <h3 [id]="despliegue.Visible ? despliegue.Animacion : 'card'" class="tool-title">
                    <strong>{{despliegue.Nombre}}</strong>
                </h3>

                <div class="habilidades">
                    <img
                        [src]="'/assets/img/' + despliegue.Img"
                        [alt]="despliegue.Nombre"
                        class="img"
                        (mouseenter)="Ani(despliegue)"
                        (mouseleave)="Offani(despliegue)">

                    <div *ngIf="despliegue.Visible" class="tool-info">
                        <p *ngFor="let texto of despliegue.Utilidad" class="parrafo">{{texto}}</p>
                    </div>

                    <div *ngIf="!despliegue.Visible" class="helper-text">
                        <strong>Pasa el cursor por la imagen para ver más información.</strong>
                    </div>
                </div>
            </article>
        </div>
    </details>
</section>
